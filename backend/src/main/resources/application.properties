spring.application.name=worker-hiring-backend
server.port=8080

# H2 file database (data survives restarts). Delete ./data to start fresh.
spring.datasource.url=jdbc:h2:file:./data/workerhiring;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# App settings
app.cors.allowed-origins=http://localhost:3000
app.auth.token-validity-days=7
app.seed-demo-data=true
